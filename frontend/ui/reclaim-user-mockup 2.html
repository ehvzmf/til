<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자원회수 유저 화면 목업</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#1F2430;--mu:#5B6472;--line:#DDE1E8;--soft:#EEF0F4;--bg2:#F4F5F8;--accent:#2F5BEA;--hot:#A12626;--hotbg:#FADADA}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff;font:14px/1.5 "Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.opt{background:var(--bg2);border-bottom:1px solid var(--line);padding:8px 40px;font-size:12px;color:var(--mu);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.opt button{border:1px solid #CBD1DB;background:#fff;border-radius:4px;padding:2px 10px;font:inherit;cursor:pointer}
.opt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pg{max-width:1240px;margin:0 auto;padding:32px 40px}
h1{margin:0;font-size:22px}
.sub{margin:4px 0 0;color:var(--mu)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:20px 0}
.tab{padding:10px 2px;font-size:15px;font-weight:500;font-family:inherit;color:var(--mu);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.tile{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile small{display:block;font-size:13px;color:var(--mu)}
.tile b{font-size:24px;font-weight:500}
.tile span{font-size:12px;color:var(--mu);margin-left:6px}
.fl{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.fi{height:36px;border:1px solid #CBD1DB;border-radius:6px;padding:0 8px;font:inherit;font-size:13px;background:#fff;color:var(--ink);min-width:0}
.fl select{width:106px}.fl input[type=date]{width:128px;padding:0 6px}.fl .q{flex:1;min-width:130px;padding:0 10px}
.fl .rs{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 4px}
.ah{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;color:var(--ink);margin-top:8px;cursor:pointer;text-align:left}
.ah em{font-style:normal;font-weight:400;color:var(--mu);font-size:13px}
.ph{height:36px;display:flex;align-items:center;padding:0 14px 0 34px;font-size:13px;font-weight:500;color:var(--mu)}
.rw{display:grid;grid-template-columns:1.8fr 1.3fr 1.4fr 1.4fr 110px;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 34px;border-bottom:1px solid var(--soft)}
.rw.acted{background:#F3F6FF}
.rn{font-weight:700;background:none;border:0;padding:0;font-family:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.rn:hover{color:var(--accent);text-decoration:underline}
.c{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.un{background:#EEF0F4;color:#3A4150}.ov{background:#FFEFD9;color:#8A4300}.lo{background:#DDF3EE;color:#0B5E4F}
.hot{background:var(--hotbg);color:var(--hot)}.ok{background:#EAF0FF;color:#1F3FB0}.done{background:#EEF0F4;color:#3A4150}.rel{background:#DDF3EE;color:#0B5E4F}.cx{background:#F0E9F8;color:#5B2C83}
.en{display:inline-block;font-size:11px;font-weight:500;padding:1px 6px;border:1px solid #CBD1DB;border-radius:4px;color:var(--mu);margin-right:4px}
.en.w{border-color:var(--hot);color:var(--hot);font-weight:700}
.mu{color:var(--mu);font-size:13px}
.lk{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:6px 10px;white-space:nowrap;background:#fff;cursor:pointer;font-family:inherit}
.lk.gh{color:var(--mu);border-color:#CBD1DB;font-weight:500}
.act{justify-self:end}
.hrow{display:grid;grid-template-columns:110px 1.9fr 1.3fr 1fr 1.4fr;gap:12px;align-items:center;min-height:60px;padding:8px 14px;border-bottom:1px solid var(--soft)}
.hh{font-size:13px;color:var(--mu);background:var(--bg2);border-radius:6px;min-height:40px}
.empty{text-align:center;padding:72px 20px;color:var(--mu)}
.empty b{display:block;color:var(--ink);font-size:16px;margin:12px 0 4px}
.ov-bg{position:fixed;inset:0;background:rgba(20,24,36,.4);display:none}
.ov-bg.open{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:100%;background:#fff;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.ov-bg.open .dr{transform:none}
.hd{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700;flex:none}
.bd{padding:20px;overflow-y:auto;flex:1}
.sec{margin:22px 0 8px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mu);padding:6px 8px;background:var(--bg2)}
.tbl td{padding:8px;border-bottom:1px solid var(--soft)}
.tbl tr.off td{color:var(--mu)}
.tl{position:relative;padding:0 0 14px 22px}
.tl::before{content:"";position:absolute;left:4px;top:16px;bottom:-4px;border-left:2px solid var(--line)}
.tl:last-child::before{display:none}
.tl.up::before{border-left-style:dashed}
.dt{position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl.up .dt{background:#fff;border:2px solid #898781}
.tl.end .dt{width:12px;height:12px;left:-1px;top:5px}
.tl small{color:var(--mu);font-size:12px}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;height:44px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;margin-bottom:8px;border:1px solid var(--accent);color:var(--accent);background:#fff}
.btn.p{background:var(--accent);color:#fff}
.btn[disabled]{background:var(--bg2);border-color:var(--line);color:var(--mu);cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.en.f{border-color:#8A4300;color:#8A4300;font-weight:700}
.adm{border:1px dashed #898781;border-radius:8px;padding:12px}
.ab{display:block;width:100%;height:40px;text-align:left;padding:0 12px;margin-bottom:8px;border:1px solid #CBD1DB;border-radius:6px;background:#fff;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.ab:last-child{margin-bottom:0}.ab.d{border-color:var(--hot);color:var(--hot);font-weight:700}
.md{position:fixed;inset:0;background:rgba(20,24,36,.5);display:none;align-items:center;justify-content:center;z-index:20}
.md.open{display:flex}
.mb{width:440px;max-width:92%;background:#fff;border-radius:12px;padding:24px}
.mbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.lk[disabled]{opacity:.4;cursor:not-allowed}
.wn{background:var(--hotbg);color:var(--hot);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media(max-width:1180px){.fl{flex-wrap:wrap}}
@media(max-width:900px){.rw,.hrow{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.pg{padding:20px}}
</style>
</head>
<body>
<div class="opt">목업 옵션
  <button id="o-n" class="on">기본</button><button id="o-e">빈 상태</button><span>권한</span><button id="o-u" class="on">유저</button><button id="o-a">관리자</button>
  <span>· 리소스명을 누르면 상세 패널이 열립니다 · 이름, 수치, 날짜는 모두 샘플입니다</span>
</div>
<main class="pg">
  <h1>자원회수</h1>
  <p class="sub">회수 예정인 리소스를 확인하시고 조치 부탁드립니다. 조치 후 다음 재평가에서 반영됩니다.</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-plan" data-tab="plan"></button>
    <button class="tab" role="tab" id="t-hist" data-tab="hist">처리 이력</button>
  </div>
  <section id="main"></section>
</main>
<div class="md" id="md"><div class="mb" role="dialog" aria-modal="true" id="mb"></div></div>
<div class="ov-bg" id="ov"><aside class="dr" role="dialog" aria-modal="true" aria-labelledby="dtt"><div class="hd"><span id="dtt">리소스 상세</span><button id="dx" aria-label="닫기" style="border:0;background:none;font-size:20px;color:var(--mu);cursor:pointer">×</button></div><div class="bd" id="db"></div></aside></div>

<script>
const TODAY = new Date(2026, 9, 15), NEXT_REEVAL = "10/18 03:00";
const R = {
  unused: { label: "미사용 → 삭제", cls: "un", act: "자원 삭제", done: "삭제" },
  over: { label: "한도 초과 → 회수", cls: "ov", act: "자원 회수", done: "회수" },
  low: { label: "사용률 저조 → 최적화", cls: "lo", act: "자원 최적화", done: "최적화" },
};
const ST = { done: { label: "회수 완료", cls: "done", c: "#3A4150" }, cancel: { label: "취소", cls: "cx", c: "#5B2C83" }, withdraw: { label: "철회", cls: "rel", c: "#0B5E4F" } };
const D = (config, env, on, cpu, mem) => ({ config, env, on, cpu, mem });
const Z = { cpu: [0, 0], mem: [0, 0] }, OFF = ["-", "-"];
const dep1 = [D("default", "dev", 1, "0.5 core", "1 GiB"), D("default", "prod", 1, "2 core", "4 GiB")];
const ROWS = [
  { id: 1, status: "plan", acct: "계정 A", proj: "web-front", name: "batch-worker-01", svc: "배치 잡", plat: "플랫폼 A", reason: "unused", ev: "미사용 47일", due: "2026-10-18", m: Z, dep: [D("default", "dev", 1, "0.5 core", "1 GiB"), D("default", "stg", 0, ...OFF), D("default", "prod", 1, "1 core", "2 GiB")] },
  { id: 2, status: "plan", acct: "계정 A", proj: "web-front", name: "api-gateway-02", svc: "API 서비스", plat: "플랫폼 B", reason: "over", ev: "한도 대비 최대 120%", due: "2026-10-20", m: { cpu: [84, 100], mem: [63, 88] }, dep: [D("default", "stg", 1, "1 core", "2 GiB"), D("default", "prod", 1, "2 core", "4 GiB")] },
  { id: 3, status: "plan", acct: "계정 A", proj: "web-front", name: "report-svc", svc: "웹 서비스", plat: "플랫폼 A", reason: "low", ev: "CPU 평균 8% (기준 10% 미만)", due: "2026-10-20", acted: true, long: true, m: { cpu: [8, 21], mem: [28, 41] }, dep: [D("default", "dev", 1, "0.5 core", "1 GiB"), D("default", "prod", 1, "2 core", "4 GiB"), D("high-mem", "prod", 0, ...OFF)] },
  { id: 4, status: "plan", acct: "계정 A", proj: "web-front", name: "cache-node-03", svc: "API 서비스", plat: "플랫폼 B", reason: "low", ev: "메모리 평균 22% (기준 30% 미만)", due: "2026-10-24", autoOk: true, m: { cpu: [11, 24], mem: [22, 35] }, dep: dep1 },
  { id: 5, status: "plan", acct: "계정 A", proj: "data-batch", name: "etl-runner-07", svc: "배치 잡", plat: "플랫폼 A", reason: "unused", ev: "미사용 62일", due: "2026-10-21", m: Z, dep: [D("default", "dev", 0, ...OFF), D("default", "prod", 0, ...OFF)] },
  { id: 6, status: "plan", acct: "계정 B", proj: "payments", name: "ledger-job-02", svc: "API 서비스", plat: "플랫폼 B", reason: "over", ev: "한도 대비 최대 108%", due: "2026-10-20", m: { cpu: [72, 100], mem: [55, 81] }, dep: dep1 },
  { id: 7, status: "plan", acct: "계정 B", proj: "payments", name: "ledger-cache-01", svc: "웹 서비스", plat: "플랫폼 A", reason: "unused", ev: "미사용 35일", due: "2026-10-25", m: Z, dep: [D("default", "dev", 1, "0.5 core", "1 GiB")] },
  { id: 8, status: "plan", acct: "계정 B", proj: "ops-tools", name: "ops-scheduler", svc: "배치 잡", plat: "플랫폼 B", reason: "low", ev: "CPU 평균 9% (기준 10% 미만)", due: "2026-10-27", acted: true, m: { cpu: [9, 19], mem: [41, 55] }, dep: dep1 },
  { id: 9, status: "plan", acct: "계정 C", proj: "analytics", name: "viz-render-04", svc: "웹 서비스", plat: "플랫폼 A", reason: "unused", ev: "미사용 90일", due: "2026-10-23", m: Z, dep: [D("default", "stg", 0, ...OFF)] },
  { id: 11, status: "done", acct: "계정 A", proj: "web-front", name: "batch-old-02", svc: "배치 잡", plat: "플랫폼 A", reason: "unused", ev: "미사용 71일", due: "2026-10-14", at: "2026-10-14 14:02", how: "회수 배치 실행", m: Z, dep: [D("default", "dev", 0, ...OFF)] },
  { id: 12, status: "withdraw", acct: "계정 B", proj: "payments", name: "api-gateway-05", svc: "API 서비스", plat: "플랫폼 B", reason: "over", ev: "한도 대비 최대 112%", due: "2026-10-16", at: "2026-10-12 03:00", how: "사유 해소 · 한도 조절 후 재평가", m: { cpu: [70, 100], mem: [52, 79] }, dep: dep1 },
  { id: 13, status: "done", acct: "계정 A", proj: "web-front", name: "cache-node-01", svc: "API 서비스", plat: "플랫폼 B", reason: "low", ev: "CPU 평균 7% (기준 10% 미만)", due: "2026-10-10", at: "2026-10-10 14:02", how: "회수 배치 실행", m: { cpu: [7, 15], mem: [36, 48] }, dep: dep1 },
  { id: 14, status: "withdraw", acct: "계정 A", proj: "data-batch", name: "etl-runner-02", svc: "배치 잡", plat: "플랫폼 A", reason: "unused", ev: "미사용 55일", due: "2026-10-12", at: "2026-10-09 03:00", how: "사유 해소 · 재배포 후 재평가", m: Z, dep: [D("default", "prod", 1, "1 core", "2 GiB")] },
  { id: 15, status: "cancel", acct: "계정 C", proj: "analytics", name: "viz-render-01", svc: "웹 서비스", plat: "플랫폼 A", reason: "unused", ev: "미사용 40일", due: "2026-10-09", at: "2026-10-05 11:20", how: "관리자 요청으로 취소", m: Z, dep: [D("default", "dev", 0, ...OFF)] },
  { id: 16, status: "done", acct: "계정 B", proj: "payments", name: "ledger-job-01", svc: "API 서비스", plat: "플랫폼 B", reason: "over", ev: "한도 대비 최대 105%", due: "2026-10-04", at: "2026-10-04 14:02", how: "회수 배치 실행", m: { cpu: [68, 100], mem: [50, 77] }, dep: dep1 },
];
const Q = (c, m) => ({ cpu: { cur: c[0], min: c[1], req: c[2], use: c[3], thr: 10, u: "core" }, mem: { cur: m[0], min: m[1], req: m[2], use: m[3], thr: 30, u: "GiB" } });
const QM = { 1: Q([1.5, 0.5, null, 0], [3, 1, null, 0]), 2: Q([3, 1, null, 84], [6, 2, null, 63]), 3: Q([0.5, 0.5, 0.4, 8], [1, 1, 0.9, 28]), 4: Q([2.5, 0.5, 2.5, 11], [5, 1, 3.7, 22]),
  5: Q([1, 0.5, null, 0], [2, 1, null, 0]), 6: Q([2.5, 0.5, null, 72], [5, 1, null, 55]), 7: Q([0.5, 0.5, null, 0], [1, 1, null, 0]), 8: Q([2.5, 0.5, 2.25, 9], [5, 1, 5, 41]),
  9: Q([0.5, 0.5, null, 0], [1, 1, null, 0]), 11: Q([0.5, 0.5, null, 0], [1, 1, null, 0]), 12: Q([2.5, 0.5, null, 70], [5, 1, null, 52]), 13: Q([2.5, 0.5, 2.2, 7], [5, 1, 5, 36]),
  14: Q([1, 0.5, null, 0], [2, 1, null, 0]), 15: Q([0.5, 0.5, null, 0], [1, 1, null, 0]), 16: Q([2.5, 0.5, null, 68], [5, 1, null, 50]) };
const ELIG = { 3: { ok: false, code: "min-quota-floor" }, 4: { ok: true }, 8: { ok: true } };
const CODE_MSG = { "min-quota-floor": "현재 자동조정을 사용할 수 없습니다. 할당량이 이미 최소 할당량에 도달했습니다." };
ROWS.forEach(r => { r.q = QM[r.id]; r.elig = ELIG[r.id]; r.adm = []; r.due0 = r.due; });
ROWS.find(r => r.id === 3).dep = [D("default", "dev", 1, "0.25 core", "0.5 GiB"), D("default", "prod", 1, "0.25 core", "0.5 GiB"), D("high-mem", "prod", 0, ...OFF)];
const $ = id => document.getElementById(id);
const dday = s => Math.round((new Date(s) - TODAY) / 864e5);
const md = s => s.slice(5, 10).replace("-", "/");
const chip = (cls, t) => `<span class="c ${cls}">${t}</span>`;
const primary = r => ({ unused: "재배포", over: "한도 조절", low: "한도 조절" })[r.reason];
const F0 = { q: "", reason: "", result: "", acct: "", proj: "", env: "", plat: "", from: "", to: "" };
let state = { tab: "plan", empty: false, admin: false, open: new Set(["계정 A"]), f: { ...F0 }, hist: false };

/* ---- 필터 ---- */
const uniq = k => [...new Set(ROWS.map(r => r[k]))];
function pass(r) {
  const f = state.f, d = r.status === "plan" ? r.due : r.at.slice(0, 10);
  return (!f.q || r.name.includes(f.q.trim().toLowerCase())) && (!f.reason || r.reason === f.reason) && (!f.result || state.tab === "plan" || r.status === f.result) &&
    (!f.acct || r.acct === f.acct) && (!f.proj || r.proj === f.proj) && (!f.env || r.dep.some(x => x.env === f.env && x.on)) &&
    (!f.plat || r.plat === f.plat) && (!f.from || d >= f.from) && (!f.to || d <= f.to);
}
function bar(hist) {
  const f = state.f;
  const sel = (key, all, opts) => `<select class="fi" data-f="${key}" aria-label="${all}"><option value="">${all}</option>${opts.map(([v, t]) => `<option value="${v}"${f[key] === v ? " selected" : ""}>${t}</option>`).join("")}</select>`;
  const pair = a => a.map(v => [v, v]);
  return `<div class="fl"><input class="fi q" data-f="q" placeholder="리소스명 검색" aria-label="리소스명 검색" value="${f.q}">
    ${sel("reason", "회수 사유", Object.entries(R).map(([k, v]) => [k, v.label]))}
    ${hist ? sel("result", "결과", Object.entries(ST).map(([k, v]) => [k, v.label])) : ""}
    ${sel("acct", "계정", pair(uniq("acct")))}${sel("proj", "프로젝트", pair(uniq("proj")))}${sel("env", "env", pair(["dev", "stg", "prod"]))}${sel("plat", "플랫폼", pair(uniq("plat")))}
    <input class="fi" type="date" data-f="from" aria-label="${hist ? "처리일" : "예정일"} 시작" value="${f.from}"><span class="mu">~</span><input class="fi" type="date" data-f="to" aria-label="${hist ? "처리일" : "예정일"} 끝" value="${f.to}">
    <button class="rs" id="reset">초기화</button></div>`;
}
function bindBar() {
  document.querySelectorAll("[data-f]").forEach(el => {
    const h = () => { state.f[el.dataset.f] = el.value; render(); if (el.dataset.f === "q") { const n = document.querySelector("[data-f=q]"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };

    <div class="mbtn"><button class="lk gh" id="mc">취소</button><button class="lk" id="ms" disabled style="color:#fff;background:var(--hot);border-color:var(--hot)">즉시 회수</button></div>`);
  $("nn").oninput = () => { $("ms").disabled = $("nn").value !== r.name; };
  $("mc").onclick = hideModal;
  $("ms").onclick = () => { r.status = "done"; r.at = "2026-10-15 10:30"; r.how = "관리자 즉시 회수"; r.byAdmin = true; done(r); };
}
const closeDrawer = () => $("ov").classList.remove("open");
$("dx").onclick = closeDrawer;
$("ov").onclick = e => { if (e.target === $("ov")) closeDrawer(); };
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if ($("md").classList.contains("open")) hideModal(); else closeDrawer(); });

/* ---- 렌더링 ---- */
function render() {
  const plan = state.tab === "plan";
  $("main").innerHTML = plan ? renderPlan() : renderHist();
  $("t-plan").setAttribute("aria-selected", plan); $("t-hist").setAttribute("aria-selected", !plan);
  if (!plan) $("t-plan").textContent = "회수 예정 " + (state.empty ? 0 : ROWS.filter(r => r.status === "plan").length);
  $("o-n").className = state.empty ? "" : "on"; $("o-e").className = state.empty ? "on" : ""; $("o-u").className = state.admin ? "" : "on"; $("o-a").className = state.admin ? "on" : "";
  document.querySelectorAll("[data-acct]").forEach(b => b.onclick = () => { const a = b.dataset.acct; state.open.has(a) ? state.open.delete(a) : state.open.add(a); render(); });
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openDrawer(Number(b.dataset.id)));
  bindBar();
}
document.querySelector(".tabs").onclick = e => { if (e.target.dataset.tab) { state.tab = e.target.dataset.tab; render(); } };
$("o-n").onclick = () => { state.empty = false; render(); };
$("o-e").onclick = () => { state.empty = true; render(); };
$("o-u").onclick = () => { state.admin = false; closeDrawer(); render(); };
$("o-a").onclick = () => { state.admin = true; closeDrawer(); render(); };
render();
</script>
</body>
</html>
