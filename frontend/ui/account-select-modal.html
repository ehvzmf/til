<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계정 선택 모달</title>
<style>
:root{--ink:#1F2430;--muted:#5B6472;--line:#DDE1E8;--soft:#EEF0F4;--accent:#2F5BEA;--sel:#F3F6FF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#F4F5F8;color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.card{max-width:560px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
.card h1{font-size:18px;margin:0 0 20px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 6px}
.in{height:38px;width:100%;border:1px solid #CBD1DB;border-radius:6px;padding:0 12px;font:inherit;color:inherit;background:#fff}
.trigger{width:100%;height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border:1px solid var(--accent);border-radius:6px;background:#fff;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.trigger span+span{color:var(--accent)}
.field{margin-bottom:16px}
.overlay{position:fixed;inset:0;background:rgba(20,24,36,.5);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{width:520px;max-width:100%;height:592px;max-height:100%;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:0 24px;height:56px;line-height:56px;font-size:17px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;height:44px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.search{padding:12px 20px;flex:none}
.list{flex:1;overflow-y:auto;border-top:1px solid var(--soft);margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;height:46px;padding:0 20px;border-bottom:1px solid var(--soft);user-select:text}
.row.sel{background:var(--sel)}
.row input{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
.row label{display:flex;align-items:center;gap:12px;flex:1;height:100%;cursor:pointer}
.row small{margin-left:auto;color:var(--muted);font-size:12px}
.rm{width:32px;height:32px;margin-right:-8px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.rm:hover{background:var(--soft)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.foot{height:68px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;flex:none}
.foot b{color:var(--accent)}
.btns{margin-left:auto;display:flex;gap:8px}
.btn{height:40px;padding:0 20px;border-radius:6px;border:1px solid #CBD1DB;background:#fff;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="card">
  <h1>대상 상세</h1>
  <div class="field"><p class="lbl">대상명</p><div class="in" style="display:flex;align-items:center">권한 그룹 A</div></div>
  <div class="field"><p class="lbl">계정명</p>
    <button class="trigger" id="open"><span id="count"></span><span>편집</span></button>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ttl">
    <h2 id="ttl">계정 선택</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-sel" data-tab="sel"></button>
      <button class="tab" role="tab" id="tab-all" data-tab="all">전체 계정</button>
    </div>
    <div class="search"><label for="q" hidden>검색</label><input class="in" id="q" type="search" autocomplete="off"></div>
    <ul class="list" id="list"></ul>
    <div class="foot">
      <div id="foot-count"></div>
      <div class="btns"><button class="btn" id="cancel">취소</button><button class="btn primary" id="apply">적용</button></div>
    </div>
  </div>
</div>

<script>
// 샘플 데이터: 실제로는 전체 계정 API / 저장된 accounts 응답으로 대체
const names = ["minsu","taehun","seoyeon","sujin","joon","hana","woo","eunbi","seho","nari","jiwon","haeun","doyun","yerin","sohee","jaemin","dahye","gunwoo","yuna","hyunwoo","somin","jihoon","areum","minjae","chaewon","siwoo","bora","junseo","narae","eunseo"];
const ALL = names.map((n, i) => ({ id: 1001 + i * 13, name: (i % 2 ? "lee." : "kim.") + n }));
let saved = new Map(ALL.filter((_, i) => i % 3 === 0 || i < 4).slice(0, 12).map(a => [a.id, a])); // 서버에 저장된 accounts
let draft, tab = "sel", query = "";

const $ = id => document.getElementById(id);
const X = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>';

function render() {
  const q = query.trim().toLowerCase();
  const match = a => !q || a.name.toLowerCase().includes(q) || String(a.id).includes(q);
  $("tab-sel").textContent = "선택됨 " + draft.size;
  $("tab-sel").setAttribute("aria-selected", tab === "sel");
  $("tab-all").setAttribute("aria-selected", tab === "all");
  $("q").placeholder = tab === "sel" ? "선택된 계정에서 검색" : "이름 또는 ID로 검색";
  $("foot-count").innerHTML = "<b>" + draft.size + "개</b> 선택됨";
  const rows = tab === "sel"
    ? [...draft.values()].filter(match).map(a =>
        `<li class="row"><span>${a.name}</span><small>ID ${a.id}</small><button class="rm" data-rm="${a.id}" aria-label="${a.name} 제거">${X}</button></li>`)
    : ALL.filter(match).map(a =>
        `<li class="row${draft.has(a.id) ? " sel" : ""}"><label><input type="checkbox" data-id="${a.id}"${draft.has(a.id) ? " checked" : ""}>${a.name}<small>ID ${a.id}</small></label></li>`);
  $("list").innerHTML = rows.join("") || `<li class="empty">${q ? "검색 결과가 없어요." : "선택된 계정이 없어요. 전체 계정 탭에서 추가하세요."}</li>`;
}
function setCount() { $("count").textContent = "계정 " + saved.size + "개 선택됨"; }
function openModal() { draft = new Map(saved); tab = "sel"; query = ""; $("q").value = ""; $("overlay").classList.add("open"); render(); }
function closeModal() { $("overlay").classList.remove("open"); $("open").focus(); }

$("open").onclick = openModal;
$("cancel").onclick = closeModal;
$("apply").onclick = () => { saved = new Map(draft); setCount(); closeModal(); console.log("accountIds", [...saved.keys()]); };
document.querySelector(".tabs").onclick = e => { const t = e.target.dataset.tab; if (t) { tab = t; render(); } };
$("q").oninput = e => { query = e.target.value; render(); };
$("list").onclick = e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { draft.delete(Number(rm.dataset.rm)); render(); }
};
$("list").onchange = e => {
  const id = Number(e.target.dataset.id), a = ALL.find(x => x.id === id);
  e.target.checked ? draft.set(id, a) : draft.delete(id);
  render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("open")) closeModal(); });
setCount();
</script>
</body>
</html>
